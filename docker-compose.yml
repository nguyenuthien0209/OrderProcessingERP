services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: op-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Your_password123!\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: op-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.Api/Dockerfile
    container_name: op-identity-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5006:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  catalog-api:
    build:
      context: .
      dockerfile: src/Services/Catalog/Catalog.Api/Dockerfile
    container_name: op-catalog-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5005:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      identity-api:
        condition: service_healthy

  inventory-api:
    build:
      context: .
      dockerfile: src/Services/Inventory/Inventory.Api/Dockerfile
    container_name: op-inventory-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5002:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-api:
        condition: service_healthy

  payments-api:
    build:
      context: .
      dockerfile: src/Services/Payments/Payments.Api/Dockerfile
    container_name: op-payments-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5003:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-api:
        condition: service_healthy

  shipping-api:
    build:
      context: .
      dockerfile: src/Services/Shipping/Shipping.Api/Dockerfile
    container_name: op-shipping-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5004:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-api:
        condition: service_healthy

  ordering-api:
    build:
      context: .
      dockerfile: src/Services/Ordering/Ordering.Api/Dockerfile
    container_name: op-ordering-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog-api:
        condition: service_started
      identity-api:
        condition: service_healthy

  notifications-worker:
    build:
      context: .
      dockerfile: src/Services/Notifications/Notifications.Worker/Dockerfile
    container_name: op-notifications-worker
    environment:
      DOTNET_ENVIRONMENT: Docker
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  sqlserver-data:
