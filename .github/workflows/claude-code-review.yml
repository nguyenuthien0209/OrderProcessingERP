name: Claude Code Review

# Automatic code review on every PR — no @claude mention needed.
# Requires a repo secret named either ANTHROPIC_API_KEY (Claude Console API key) or
# CLAUDE_CODE_OAUTH_TOKEN (from a Pro/Max/Team/Enterprise subscription via `claude setup-token`).
# Add it under Settings -> Secrets and variables -> Actions before this workflow can run.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # If using a Claude subscription instead of a Console API key, comment out the line
          # above and use this one instead:
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the conventions in CLAUDE.md (six independent .NET 8
            microservices communicating over RabbitMQ via event choreography, CQRS/MediatR
            application layers, the transactional outbox pattern, and the per-service Domain /
            Application / Infrastructure / Api layering). Focus on:

            1. **Correctness** — logic errors, broken event choreography, race conditions, incorrect
               EF Core / MassTransit / MediatR usage, idempotency gaps in consumers.
            2. **Architecture fit** — does the change respect existing layering and the "handlers
               depend on I<Service>DbContext, never the concrete DbContext" rule? Does any new
               event-publishing path use the outbox instead of publishing directly?
            3. **Security** — injection, secrets, auth/authorization gaps, unvalidated input at
               service boundaries.
            4. **Simplification/reuse** — unnecessary duplication across services that should be
               shared in BuildingBlocks/Common, or premature abstraction that shouldn't be.
            5. **Test coverage** — missing or weakened Domain.Tests coverage for changed business
               rules.

            Post specific, actionable inline comments on the affected lines. Use a single top-level
            summary comment for overall observations. Do not comment on purely stylistic
            preferences already covered by existing conventions.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
